name: Daily Review Scraper

on:
  schedule:
    # Runs at 04:00 UTC (07:00 TRT) and 16:00 UTC (19:00 TRT) every day
    - cron: '0 4 * * *'
    - cron: '0 16 * * *'
  # Allows you to run this workflow manually from the Actions tab with optional parameters
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Backfill historical data (bypass watermark)'
        type: boolean
        default: false
      since:
        description: 'Cutoff date for backfill (YYYY-MM-DD)'
        type: string
        default: ''
      dry_run:
        description: 'Dry run (do not write to database)'
        type: boolean
        default: false
      platform:
        description: 'Specific platform (leave empty for all, or: eksi, sikayetvar, play, app)'
        type: string
        default: ''

concurrency:
  group: customer-voice-scraper
  cancel-in-progress: false

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          cd scraper
          python -m pip install --upgrade pip
          pip install --no-deps app-store-scraper==0.3.5
          pip install -r requirements.txt

      - name: Random Delay (Anti-Bot)
        # Random sleep up to 20 minutes when running on schedule to prevent fixed-time bot fingerprinting
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]; then
            DELAY=$((RANDOM % 1200))
            echo "Running on a schedule. Sleeping for $DELAY seconds..."
            sleep $DELAY
          else
            echo "Running manually. Skipping delay."
          fi

      - name: Run Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SIKAYETVAR_PROXY_URL: ${{ secrets.SIKAYETVAR_PROXY_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          cd scraper
          CMD="python main.py"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            CMD="$CMD --dry-run"
          fi
          if [ "${{ inputs.backfill }}" = "true" ]; then
            CMD="$CMD --backfill"
            if [ -n "${{ inputs.since }}" ]; then
              CMD="$CMD --since ${{ inputs.since }}"
            fi
          fi
          if [ -n "${{ inputs.platform }}" ]; then
            CMD="$CMD --platform ${{ inputs.platform }}"
          fi
          echo "Executing: $CMD"
          eval $CMD

      - name: Keep Workflow Active
        # Prevents GitHub from automatically disabling scheduled workflows after 60 days of inactivity
        uses: gautamkrishnar/keepalive-workflow@v2
        if: always()
